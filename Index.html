<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Husseiny English | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0B132B',
                card: '#1C2541',
                accent: '#3A506B',
                gold: '#F4D35E',
                goldHover: '#E0BF3B'
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 dark:bg-brand-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 antialiased relative overflow-x-hidden">

  <header class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center z-50">
    
    <!-- أعلى اليمين (في تخطيط RTL): زر القائمة المنسدلة -->
    <div class="relative">
      <button onclick="toggleMenu(event)" class="w-11 h-11 rounded-2xl bg-white dark:bg-brand-card shadow-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-amber-400 hover:scale-105 transition-all">
        <i class="fa-solid fa-bars-staggered text-base"></i>
      </button>
      <!-- تم ضبط الموضع هنا بـ right-0 مع ضمان عدم خروجها عبر الحدود وتمركزها للداخل -->
      <div id="socialMenu" class="hidden absolute top-14 right-0 w-52 bg-white dark:bg-brand-card rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-2.5 space-y-1.5 z-50">
        <a href="https://www.youtube.com/channel/UCLtzzKqPRJsE2zoQB_cTw4A" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 w-full px-3.5 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-rose-600 transition text-right">
          <i class="fa-brands fa-youtube text-base w-5 text-center"></i> 
          <span>قناة اليوتيوب</span>
        </a>
        <a href="https://www.facebook.com/The.Hulk.in.English" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 w-full px-3.5 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-blue-600 transition text-right">
          <i class="fa-brands fa-facebook text-base w-5 text-center"></i> 
          <span>صفحة الفيسبوك</span>
        </a>
        <a href="https://www.tiktok.com/@mohamedhussein7076" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 w-full px-3.5 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-slate-900 dark:text-slate-100 transition text-right">
          <i class="fa-brands fa-tiktok text-base w-5 text-center"></i> 
          <span>تيك توك</span>
        </a>
        <button onclick="sharePlatform()" class="flex items-center gap-3 w-full px-3.5 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-amber-500 transition text-right">
          <i class="fa-solid fa-share-nodes text-base w-5 text-center"></i> 
          <span>مشاركة المنصة (Share)</span>
        </button>
      </div>
    </div>

    <!-- أعلى اليسار (في تخطيط RTL): الواتساب وزر الثيم -->
    <div class="flex items-center gap-3">
      <a href="https://wa.me/201225909390" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-2xl shadow-lg shadow-emerald-500/25 hover:scale-105 transition-all">
        <i class="fa-brands fa-whatsapp text-xl text-white"></i>
        <span dir="ltr" class="text-xs sm:text-sm font-black tracking-wider">01225909390</span>
      </a>

      <button onclick="toggleTheme()" class="w-11 h-11 rounded-2xl bg-white dark:bg-brand-card shadow-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-amber-500 hover:scale-105 transition-all">
        <i id="themeIcon" class="fa-solid fa-sun text-base"></i>
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-6 py-4 w-full flex flex-col items-center text-center space-y-8 my-auto">
    
    <div class="relative group">
      <div class="absolute -inset-1.5 bg-gradient-to-r from-amber-400 to-indigo-600 rounded-full blur-lg opacity-40 group-hover:opacity-75 transition duration-500"></div>
      <div class="relative w-48 h-48 sm:w-52 sm:h-52 rounded-full bg-white dark:bg-brand-card border-4 border-amber-400 shadow-2xl flex items-center justify-center overflow-hidden">
        <img src="mr-mohamed.png" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200'">
      </div>
    </div>

    <div class="space-y-2">
      <h2 class="text-xl md:text-2xl font-black text-slate-900 dark:text-white tracking-wide">
        Your journey to excellence starts here
      </h2>
      <p class="text-xs md:text-sm font-bold text-slate-500 dark:text-slate-400">
        رحلتك إلى التميز تبدأ من هنا
      </p>
    </div>

    <button onclick="openPortal()" class="w-full max-w-xs bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-blue-950 font-black py-4 px-8 rounded-2xl shadow-xl hover:shadow-amber-500/20 hover:scale-105 transition-all text-base flex items-center justify-center gap-3 cursor-pointer">
      <span>ابدأ / Start</span>
      <i class="fa-solid fa-arrow-left"></i>
    </button>

  </main>

  <footer class="w-full text-center py-6 text-[11px] text-slate-400 dark:text-slate-500 font-bold">
    El Husseiny English - Created by Mr. Mohamed Hussein © 2026
  </footer>

  <script>
    // دالة فتح وإغلاق القائمة المنسدلة مع منع انتشار الحدث
    function toggleMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById("socialMenu");
      menu.classList.toggle("hidden");
    }

    // إغلاق القائمة عند النقر في أي مكان خارجها
    window.addEventListener("click", function(e) {
      const menu = document.getElementById("socialMenu");
      if (menu && !menu.contains(e.target) && !e.target.closest('button')) {
        menu.classList.add("hidden");
      }
    });

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById("themeIcon");
      if (html.classList.contains("light")) {
        html.classList.remove("light");
        html.classList.add("dark");
        if(icon) icon.className = "fa-solid fa-moon text-base";
        localStorage.setItem("theme", "dark");
      } else {
        html.classList.remove("dark");
        html.classList.add("light");
        if(icon) icon.className = "fa-solid fa-sun text-base";
        localStorage.setItem("theme", "light");
      }
    }

    if(localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.remove("light");
      document.documentElement.classList.add("dark");
      const icon = document.getElementById("themeIcon");
      if(icon) icon.className = "fa-solid fa-moon text-base";
    }

    function sharePlatform() {
      if (navigator.share) {
        navigator.share({
          title: 'El Husseiny English platform',
          text: 'منصة السيد محمد حسين للغة الإنجليزية',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('تم نسخ رابط المنصة بنجاح!');
      }
    }

    function openPortal() {
      window.location.href = "gateway.html"; 
    }
  </script>
</body>
</html>
